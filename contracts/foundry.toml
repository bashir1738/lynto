[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
local = "http://127.0.0.1:8545"
arc = "https://rpc.mainnet.arc.io"
arc_testnet = "https://rpc.testnet.arc.io"

[etherscan]
arc = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer.arc.io/api" }
arc_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer.testnet.arc.io/api" }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
